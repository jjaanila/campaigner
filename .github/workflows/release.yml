name: Release
on:
  push:
    branches: [master]
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  test:
    uses: ./.github/workflows/tests.yml
  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # OIDC trusted publishing to npm + provenance
      contents: write # create git tag and GitHub release
      issues: write # post release comments on issues/PRs
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install -g npm@latest # trusted publishing requires npm >= 11.5.1
      - run: npm ci
      - run: npx semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
